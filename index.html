<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vasana Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-card">
        <!-- Date & Time Header -->
        <div class="datetime-container">
            <div id="current-date">--/--/----</div>
            <div id="current-time">00:00:00 AM</div>
        </div>

        <!-- Animated Gradient Title -->
        <h1 class="app-title">Vasana Calculator</h1>

        <!-- Note/Description Field & Save Button -->
        <div class="note-container">
            <input type="text" id="calc-note" placeholder="ගණනය කිරීමේ විස්තරය (උදා: බඩු ලැයිස්තුව)...">
            <button id="save-btn" onclick="saveCalculation()">
                <span>💾 Save</span>
            </button>
        </div>

        <!-- Screen/Display -->
        <div class="display-container">
            <input type="text" id="display" placeholder="0" readonly>
        </div>

        <!-- 3D Buttons -->
        <div class="buttons">
            <button class="btn btn-action" onclick="clearDisplay()">C</button>
            <button class="btn btn-action" onclick="deleteLast()">DEL</button>
            <button class="btn btn-operator" onclick="appendValue('/')">÷</button>
            <button class="btn btn-operator" onclick="appendValue('*')">×</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn btn-operator" onclick="appendValue('-')">-</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn btn-operator" onclick="appendValue('+')">+</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn btn-equal" onclick="calculateResult()">=</button>

            <button class="btn btn-zero" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
        </div>

        <!-- Bottom Controls: View Saved & XML Download -->
        <div class="extra-controls">
            <button class="btn-extra" onclick="toggleSavedData()">👁️ View Saved</button>
            <button class="btn-extra download-btn" onclick="downloadXML()">📥 Download XML</button>
        </div>

        <!-- Saved History Modal / List -->
        <div id="saved-modal" class="saved-modal hidden">
            <div class="saved-header">
                <h3>Saved Records</h3>
                <button class="close-btn" onclick="toggleSavedData()">✕</button>
            </div>
            <div id="saved-list" class="saved-list">
                <!-- Saved items render here -->
            </div>
            <button class="clear-history-btn" onclick="clearAllHistory()">Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
