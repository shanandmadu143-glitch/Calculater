<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saved History</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font for Clean UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="header-content">
                <h1>Saved History</h1>
                <span class="count-badge" id="itemCount">0 Items</span>
            </div>
            <p class="hint-text">
                <span class="hint-edit">➔ Swipe Right to Edit</span>
                <span class="hint-delete">Swipe Left to Delete ➔</span>
            </p>
        </header>

        <!-- Dynamic List Container -->
        <main class="history-container" id="historyContainer">
            <!-- Items rendered via JavaScript -->
        </main>
    </div>

    <!-- Professional Edit Modal -->
    <div id="editModal" class="modal-backdrop hidden" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit Record</h3>
                <button class="btn-close" onclick="closeEditModal()" aria-label="Close">&times;</button>
            </div>
            
            <form id="editForm" onsubmit="handleSaveEdit(event)">
                <input type="hidden" id="editItemId">
                
                <div class="form-group">
                    <label for="editItemName">Description / Title</label>
                    <input type="text" id="editItemName" class="form-control" placeholder="Enter title" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="editItemAmount">Amount (LKR)</label>
                    <input type="number" step="0.01" id="editItemAmount" class="form-control" placeholder="0.00" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
