<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vasana Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- html2pdf Library for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="calculator-card">
        <!-- Date & Time Header -->
        <div class="datetime-header">
            <span id="current-date">YYYY-MM-DD</span> | <span id="current-time">00:00:00 AM</span>
        </div>

        <!-- Calculator Display -->
        <div class="display-container">
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <!-- Note Input with Datalist Suggestions -->
        <div class="note-container">
            <input type="text" id="calc-note" list="saved-notes-list" placeholder="විස්තරය (උදා: බඩු ලැයිස්තුව)..." maxlength="50" autocomplete="off">
            <datalist id="saved-notes-list">
                <!-- Javascript මගින් Saved Notes මෙතැනට Auto Add වේ -->
            </datalist>
            <button id="save-btn" type="button" title="Save Calculation">💾 Save</button>
        </div>

        <!-- Action & View Buttons -->
        <div class="top-actions">
            <button id="view-btn" type="button">📋 View Saved History</button>
            <button id="download-btn" type="button">📥 Export / Share</button>
        </div>

        <!-- Keypad Buttons -->
        <div class="buttons">
            <button data-action="clear" class="btn-func">C</button>
            <button data-action="delete" class="btn-func">⌫</button>
            <button data-val="/" class="btn-op">÷</button>
            <button data-val="*" class="btn-op">×</button>

            <button data-val="7">7</button>
            <button data-val="8">8</button>
            <button data-val="9">9</button>
            <button data-val="-" class="btn-op">-</button>

            <button data-val="4">4</button>
            <button data-val="5">5</button>
            <button data-val="6">6</button>
            <button data-val="+" class="btn-op">+</button>

            <button data-val="1">1</button>
            <button data-val="2">2</button>
            <button data-val="3">3</button>
            <button data-action="calculate" class="btn-equal">=</button>

            <button data-val="0" class="btn-zero">0</button>
            <button data-val=".">.</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-message" class="toast hidden"></div>

    <!-- Saved History Modal -->
    <div id="saved-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📜 Saved History</h3>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <p style="font-size:11px; color:#aaa; margin-bottom:10px; text-align:center;">
                👉 දකුණට Swipe කර Edit කරන්න | 👈 වමට Swipe කර Delete කරන්න
            </p>
            <div id="saved-list" class="saved-list-container">
                <!-- Saved items rendered dynamically -->
            </div>
            <div class="modal-footer">
                <button id="clear-all-btn" class="btn-danger">Clear All History</button>
            </div>
        </div>
    </div>

    <!-- Edit Record Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Edit Record</h3>
                <button id="close-edit-btn" class="close-btn">&times;</button>
            </div>
            <div class="edit-form">
                <label>විස්තරය / නම:</label>
                <input type="text" id="edit-note" maxlength="50">
                
                <label>ගණන / අගය:</label>
                <input type="text" id="edit-expression">

                <div class="modal-buttons" style="margin-top: 15px;">
                    <button id="save-edit-btn" class="btn-success">Update</button>
                    <button id="cancel-edit-btn" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Export / Share Modal -->
    <div id="download-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📤 Export or Share Data</h3>
                <button id="close-download-btn" class="close-btn">&times;</button>
            </div>
            <div class="export-form">
                <label for="export-filename">File Name:</label>
                <input type="text" id="export-filename" placeholder="Enter file name..." maxlength="30">

                <label for="export-format">Select Format:</label>
                <select id="export-format">
                    <option value="pdf">PDF Document (.pdf)</option>
                    <option value="word">Word Document (.doc)</option>
                    <option value="xml">XML Document (.xml)</option>
                    <option value="html">HTML Web Page (.html)</option>
                </select>

                <div class="modal-buttons">
                    <button id="confirm-download-btn" class="btn-primary">
                        <span id="download-spinner" class="spinner hidden"></span>
                        <span id="download-btn-text">Download</span>
                    </button>
                    <button id="confirm-share-btn" class="btn-share">
                        <span id="share-spinner" class="spinner hidden"></span>
                        <span id="share-btn-text">🔗 Share File</span>
                    </button>
                    <button id="cancel-download-btn" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
