<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator & Saved History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Calculator Section -->
        <div class="calculator-card">
            <div class="calc-display">
                <div id="calcExpression" class="calc-expression">0</div>
                <div id="calcResult" class="calc-result">0.00</div>
            </div>

            <div class="save-input-group">
                <input type="text" id="noteInput" placeholder="සටහන / නම ඇතුළත් කරන්න..." autocomplete="off">
                <button id="btnSave" onclick="saveCalculation()">Save</button>
            </div>

            <div class="calc-keypad">
                <button class="btn-key btn-action" onclick="clearCalc()">C</button>
                <button class="btn-key btn-action" onclick="deleteDigit()">⌫</button>
                <button class="btn-key btn-op" onclick="appendOp('%')">%</button>
                <button class="btn-key btn-op" onclick="appendOp('/')">÷</button>

                <button class="btn-key" onclick="appendNum('7')">7</button>
                <button class="btn-key" onclick="appendNum('8')">8</button>
                <button class="btn-key" onclick="appendNum('9')">9</button>
                <button class="btn-key btn-op" onclick="appendOp('*')">×</button>

                <button class="btn-key" onclick="appendNum('4')">4</button>
                <button class="btn-key" onclick="appendNum('5')">5</button>
                <button class="btn-key" onclick="appendNum('6')">6</button>
                <button class="btn-key btn-op" onclick="appendOp('-')">-</button>

                <button class="btn-key" onclick="appendNum('1')">1</button>
                <button class="btn-key" onclick="appendNum('2')">2</button>
                <button class="btn-key" onclick="appendNum('3')">3</button>
                <button class="btn-key btn-op" onclick="appendOp('+')">+</button>

                <button class="btn-key" onclick="appendNum('00')">00</button>
                <button class="btn-key" onclick="appendNum('0')">0</button>
                <button class="btn-key" onclick="appendNum('.')">.</button>
                <button class="btn-key btn-equal" onclick="calculate()">=</button>
            </div>
        </div>

        <!-- Saved History Section -->
        <div class="history-section">
            <div class="history-header">
                <h3>Saved History</h3>
                <span id="historyCount">0 Items</span>
            </div>

            <!-- Fix: Items පැහැදිලිව පෙනෙන සහ Swipe කළ හැකි List එක -->
            <div id="historyContainer" class="history-list"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-backdrop hidden">
        <div class="modal-box">
            <h3>Edit History Item</h3>
            <input type="hidden" id="editId">
            <label>නම (Title)</label>
            <input type="text" id="editName" class="modal-input">
            <label>ගණන (Amount)</label>
            <input type="number" step="0.01" id="editAmount" class="modal-input">
            <div class="modal-actions">
                <button onclick="closeEditModal()" class="btn-cancel">Cancel</button>
                <button onclick="saveEdit()" class="btn-save">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
