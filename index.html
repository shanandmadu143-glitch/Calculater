<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM Calculator Pro MAX</title>
    <link rel="stylesheet" href="style.css">
    <!-- PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="theme-dark">
    <!-- Animated Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="calculator-container">
        <!-- Header & Clock -->
        <div class="header">
            <div class="time-info">
                <span id="current-date">YYYY-MM-DD</span>
                <span id="current-time">00:00:00 AM</span>
            </div>
            <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
        </div>

        <!-- Mode Selector Switch -->
        <div class="mode-selector">
            <label class="mode-radio">
                <input type="radio" name="app-mode" value="calc" checked>
                <span class="mode-label">🖩 Calculator</span>
            </label>
            <label class="mode-radio">
                <input type="radio" name="app-mode" value="kg">
                <span class="mode-label">⚖️ Kg Mode</span>
            </label>
        </div>

        <!-- Display Screen (Calculator Mode) -->
        <div id="calc-display-area" class="display-container">
            <div id="live-preview" class="live-preview"></div>
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <!-- Shared Note Input Area -->
        <div class="input-container">
            <input type="text" id="calc-note" placeholder="විස්තරය (උදා: බඩු ලැයිස්තුව, නම)..." autocomplete="off">
            <div id="custom-suggestions" class="suggestions-box hidden"></div>
        </div>

        <!-- Kg Inputs Area (Hidden by default) -->
        <div id="kg-inputs-area" class="kg-inputs-grid hidden">
            <input type="number" id="kg-input-weight" placeholder="Kg ගණන (Weight)">
            <input type="number" id="kg-input-pieces" placeholder="කොටස් ගණන (Pieces)">
            <input type="number" id="kg-input-amount" class="full-width-input" placeholder="මුළු මුදල (Amount - Optional)">
        </div>

        <!-- Primary Action Buttons -->
        <div class="action-bar-grid">
            <button id="save-btn" class="action-btn save" title="දත්ත සුරකින්න">💾 Save</button>
            <button id="view-btn" class="action-btn view icon-only" title="History බලන්න">📜</button>
            <button id="download-btn" class="action-btn export icon-only" title="Export / Share">📥</button>
        </div>

        <!-- Keypad Grid (Calculator Mode) -->
        <div id="calc-keypad-area" class="buttons">
            <button data-action="clear" class="btn btn-cmd">C</button>
            <button data-action="delete" class="btn btn-cmd">⌫</button>
            <button data-val="/" class="btn btn-op">÷</button>
            <button data-val="*" class="btn btn-op">×</button>

            <button data-val="7" class="btn">7</button>
            <button data-val="8" class="btn">8</button>
            <button data-val="9" class="btn">9</button>
            <button data-val="-" class="btn btn-op">-</button>

            <button data-val="4" class="btn">4</button>
            <button data-val="5" class="btn">5</button>
            <button data-val="6" class="btn">6</button>
            <button data-val="+" class="btn btn-op">+</button>

            <button data-val="1" class="btn">1</button>
            <button data-val="2" class="btn">2</button>
            <button data-val="3" class="btn">3</button>
            <button data-action="calculate" class="btn btn-equal font-lg">=</button>

            <button data-val="0" class="btn btn-zero">0</button>
            <button data-val="." class="btn">.</button>
        </div>
    </div>

    <!-- History Modal -->
    <div id="saved-modal" class="modal hidden">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h3>📜 Saved History</h3>
                <button id="clear-all-btn" class="danger-btn icon-only-sm" title="සියල්ල මකන්න">🗑️</button>
            </div>
            
            <div class="history-controls">
                <input type="text" id="history-search" placeholder="🔍 සෙවුම (Search)...">
                <p class="swipe-hint">👉 Swipe Right to Edit | Swipe Left to Delete 👈</p>
            </div>

            <div id="saved-list" class="saved-list"></div>

            <div class="history-total-box">
                <span>මුළු එකතුව (Total):</span>
                <span id="history-total-val">0.00</span>
            </div>

            <button id="close-modal-btn" class="close-btn margin-top-10">✖️ Close</button>
        </div>
    </div>

    <!-- Edit Record Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ සංස්කරණය (Edit)</h3>
                <span id="close-edit-btn" class="close-x">&times;</span>
            </div>
            <div class="edit-form">
                <label for="edit-note">විස්තරය / Note:</label>
                <input type="text" id="edit-note">
                
                <div id="edit-kg-section" class="hidden">
                    <label>Kg ගණන:</label>
                    <input type="number" id="edit-kg-val">
                    <label>කොටස් ගණන:</label>
                    <input type="number" id="edit-pieces-val">
                </div>

                <label for="edit-expression">අගය / Amount:</label>
                <input type="number" id="edit-expression">

                <div class="modal-actions icon-actions">
                    <button id="save-edit-btn" class="action-btn save icon-only" title="Save Changes">💾 Save</button>
                    <button id="cancel-edit-btn" class="action-btn cancel icon-only" title="Cancel">✖️ Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Export & Share Modal -->
    <div id="download-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📥 Export & Share</h3>
                <span id="close-download-btn" class="close-x">&times;</span>
            </div>
            <div class="export-form">
                <label for="export-filename">File Name:</label>
                <input type="text" id="export-filename" placeholder="Enter file name...">
                <label for="export-format">Format:</label>
                <select id="export-format">
                    <option value="pdf">PDF Document (.pdf)</option>
                    <option value="word">Word Document (.doc)</option>
                    <option value="xml">XML Data (.xml)</option>
                    <option value="html">HTML Webpage (.html)</option>
                </select>
                <div class="modal-actions icon-actions">
                    <button id="confirm-download-btn" class="action-btn export">⬇️ Download</button>
                    <button id="confirm-share-btn" class="action-btn share">🔗 Share</button>
                    <button id="cancel-download-btn" class="action-btn cancel icon-only">✖️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Settings</h3>
                <span id="close-settings-x" class="close-x">&times;</span>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <span>Theme</span>
                    <select id="theme-select">
                        <option value="theme-dark">🌙 Premium Dark</option>
                        <option value="theme-light">☀️ Clean Light</option>
                        <option value="theme-neon">⚡ Neon Cyber</option>
                        <option value="theme-emerald">🌿 Emerald Green</option>
                    </select>
                </div>

                <div class="setting-item">
                    <span>Key Sounds</span>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="setting-item flex-col align-start">
                    <span>Data Backup & Restore</span>
                    <div class="backup-actions">
                        <button id="export-json-btn" class="btn-small">💾 Backup</button>
                        <button id="import-json-btn" class="btn-small">📂 Restore</button>
                        <input type="file" id="import-file-input" accept=".json" class="hidden">
                    </div>
                </div>
            </div>
            <button id="close-settings-btn" class="close-btn margin-top-15">✖️ Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
