<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- html2pdf Library for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="calculator-card">
        <!-- Header Section -->
        <div class="calc-header">
            <span id="current-date">0000-00-00</span>
            <div class="header-right">
                <span class="app-title">WM Calculator</span>
                <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
            </div>
        </div>

        <!-- Display Screen -->
        <div class="display-container">
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <!-- Searchable Input Field & Save Icon Button -->
        <div class="note-container">
            <div class="input-wrapper">
                <input type="text" id="calc-note" placeholder="විස්තරය (උදා: බඩු ලැයිස්තුව)..." maxlength="50" autocomplete="off">
                <!-- Custom Searchable Suggestions List -->
                <div id="custom-suggestions" class="suggestions-dropdown hidden"></div>
            </div>
            <button id="save-btn" type="button" title="Save Calculation" aria-label="Save">
                <span class="btn-icon">💾</span>
            </button>
        </div>

        <!-- Calculator Keypad Buttons -->
        <div class="buttons">
            <button type="button" data-action="clear" class="btn-clear">C</button>
            <button type="button" data-action="delete" class="btn-action">⌫</button>
            <button type="button" data-val="/" class="btn-operator">÷</button>
            <button type="button" data-val="*" class="btn-operator">×</button>

            <button type="button" data-val="7">7</button>
            <button type="button" data-val="8">8</button>
            <button type="button" data-val="9">9</button>
            <button type="button" data-val="-" class="btn-operator">-</button>

            <button type="button" data-val="4">4</button>

            <button type="button" data-val="5">5</button>
            <button type="button" data-val="6">6</button>
            <button type="button" data-val="+" class="btn-operator">+</button>

            <button type="button" data-val="1">1</button>
            <button type="button" data-val="2">2</button>
            <button type="button" data-val="3">3</button>
            <button type="button" data-action="calculate" class="btn-equal">=</button>

            <button type="button" data-val="0" class="btn-zero">0</button>
            <button type="button" data-val=".">.</button>
        </div>

        <!-- View History & Download Options Header -->
        <div class="footer-actions">
            <button id="view-btn" type="button" class="btn-secondary">📜 View Saved History</button>
            <button id="download-btn" type="button" class="btn-secondary">📥 Export / Share</button>
        </div>
    </div>

    <!-- Hidden Audio Element for Background Music -->
    <audio id="bg-audio" loop preload="auto">
        <source src="bg-music.mp3" type="audio/mpeg">
    </audio>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="txt-settings-title">⚙️ Settings</h3>
            
            <!-- Theme Switch -->
            <div class="setting-row">
                <label id="txt-theme-label" for="theme-toggle">Dark Mode</label>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <!-- Background Music Switch -->
            <div class="setting-row">
                <label id="txt-audio-label" for="audio-toggle">Background Music 🎵</label>
                <label class="switch">
                    <input type="checkbox" id="audio-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <!-- Language Selector -->
            <div class="setting-row vertical-setting">
                <label id="txt-lang-label" for="language-select">Language / භාෂාව / மொழி</label>
                <select id="language-select">
                    <option value="si">සිංහල (Sinhala)</option>
                    <option value="en">English</option>
                    <option value="ta">தமிழ் (Tamil)</option>
                </select>
            </div>

            <div class="modal-actions">
                <button id="close-settings-btn" class="btn-secondary">Close</button>
            </div>
            <button id="close-settings-x" class="close-x">&times;</button>
        </div>
    </div>

    <!-- Saved History Modal -->
    <div id="saved-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="txt-saved-title">Saved Calculations History</h3>
            <div id="saved-list" class="saved-list"></div>
            <div class="modal-actions">
                <button id="clear-all-btn" class="btn-danger">Clear All History</button>
                <button id="close-modal-btn" class="btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Edit Record Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="txt-edit-title">Edit Record</h3>
            <input type="text" id="edit-note" placeholder="Note / Title" maxlength="50">
            <input type="text" id="edit-expression" placeholder="Value / Expression">
            <div class="modal-actions">
                <button id="save-edit-btn" class="btn-primary">Save Changes</button>
                <button id="cancel-edit-btn" class="btn-secondary">Cancel</button>
            </div>
            <button id="close-edit-btn" class="close-x">&times;</button>
        </div>
    </div>

    <!-- Download/Export Modal -->
    <div id="download-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="txt-export-title">Export or Share History</h3>
            <div class="form-group">
                <label for="export-filename">File Name:</label>
                <input type="text" id="export-filename" placeholder="Enter File Name (e.g. My_Expenses)">
            </div>
            <div class="form-group">
                <label for="export-format">Format:</label>
                <select id="export-format">
                    <option value="pdf">PDF Document (.pdf)</option>
                    <option value="word">Word Document (.doc)</option>
                    <option value="xml">XML Document (.xml)</option>
                    <option value="html">HTML Web Page (.html)</option>
                </select>
            </div>
            <div class="modal-actions vertical">
                <button id="confirm-download-btn" class="btn-primary">
                    <span id="download-btn-text">Download</span>
                    <span id="download-spinner" class="spinner hidden"></span>
                </button>
                <button id="confirm-share-btn" class="btn-share">
                    <span id="share-btn-text">🔗 Share File</span>
                    <span id="share-spinner" class="spinner hidden"></span>
                </button>
                <button id="cancel-download-btn" class="btn-secondary">Cancel</button>
            </div>
            <button id="close-download-btn" class="close-x">&times;</button>
        </div>
    </div>

    <!-- Toast Message -->
    <div id="toast-message" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
