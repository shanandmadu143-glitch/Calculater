<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Performance Dynamic List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>🚀 High-Performance Dynamic List (Virtual Scroll)</h2>
        <div class="controls">
            <button id="add-items-btn" class="btn">දත්ත 10,000ක් එකතු කරන්න</button>
            <button id="clear-btn" class="btn btn-danger">Clear All</button>
            <span id="status" class="status-text">Items: 0</span>
        </div>

        <!-- Virtual List Window Container -->
        <div id="virtual-scroll-container" class="scroll-container">
            <div id="virtual-spacer" class="virtual-spacer"></div>
            <div id="virtual-content" class="virtual-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
