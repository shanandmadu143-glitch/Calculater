<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vasana Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Optional: html2pdf library for PDF exports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="calculator-card">
        <!-- Header Clock -->
        <div class="clock-header">
            <span id="current-date">--</span>
            <span id="current-time">--</span>
        </div>

        <!-- Display -->
        <input type="text" id="display" readonly placeholder="0">

        <!-- Note Input Field with Suggestions -->
        <div class="note-container">
            <input type="text" id="calc-note" list="saved-notes-list" placeholder="විස්තරය (උදා: බඩු ලැයිස්තුව)..." maxlength="50" autocomplete="off">
            <datalist id="saved-notes-list"></datalist>
            <button id="save-btn" type="button">💾 Save</button>
        </div>

        <!-- Keypad -->
        <div class="buttons">
            <button data-action="clear" class="btn-action">C</button>
            <button data-action="delete" class="btn-action">⌫</button>
            <button data-val="/" class="btn-op">÷</button>
            <button data-val="*" class="btn-op">×</button>

            <button data-val="7">7</button>
            <button data-val="8">8</button>
            <button data-val="9">9</button>
            <button data-val="-" class="btn-op">-</button>

            <button data-val="4">4</button>
            <button data-val="5">5</button>
            <button data-val="6">6</button>
            <button data-val="+" class="btn-op">+</button>

            <button data-val="1">1</button>
            <button data-val="2">2</button>
            <button data-val="3">3</button>
            <button data-action="calculate" class="btn-equals">=</button>

            <button data-val="0" class="btn-zero">0</button>
            <button data-val=".">.</button>
        </div>

        <!-- Action Bar -->
        <div class="bottom-actions">
            <button id="view-btn">📋 Saved History</button>
            <button id="download-btn">📥 Export / Share</button>
        </div>
    </div>

    <!-- Toast Message -->
    <div id="toast-message" class="toast hidden"></div>

    <!-- Saved History Modal -->
    <div id="saved-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>💾 Saved History</h3>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <p class="swipe-hint">💡 Tip: Swipe Right to Edit | Swipe Left to Delete</p>
            <div id="saved-list" class="saved-list-container"></div>
            <div class="modal-footer">
                <button id="clear-all-btn" class="btn-danger">Clear All</button>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h3>✏️ Edit Item</h3>
            <label for="edit-note">Note / Description:</label>
            <input type="text" id="edit-note" class="modal-input">
            
            <label for="edit-expression">Value / Amount:</label>
            <input type="text" id="edit-expression" class="modal-input">

            <div class="modal-actions">
                <button id="save-edit-btn" class="btn-primary">Save Changes</button>
                <button id="cancel-edit-btn" class="btn-secondary">Cancel</button>
                <button id="close-edit-btn" class="hidden"></button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="download-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📥 Export / Share Data</h3>
                <button id="close-download-btn" class="close-btn">&times;</button>
            </div>
            
            <label for="export-filename">File Name:</label>
            <input type="text" id="export-filename" class="modal-input" placeholder="Enter file name...">

            <label for="export-format">Select Format:</label>
            <select id="export-format" class="modal-input">
                <option value="pdf">PDF Document (.pdf)</option>
                <option value="word">Word Document (.doc)</option>
                <option value="xml">XML File (.xml)</option>
                <option value="html">HTML File (.html)</option>
            </select>

            <div class="modal-actions">
                <button id="confirm-download-btn" class="btn-primary">
                    <span id="download-spinner" class="spinner hidden"></span>
                    <span id="download-btn-text">Download</span>
                </button>
                <button id="confirm-share-btn" class="btn-share">
                    <span id="share-spinner" class="spinner hidden"></span>
                    <span id="share-btn-text">🔗 Share File</span>
                </button>
                <button id="cancel-download-btn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
