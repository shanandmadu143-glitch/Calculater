<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM Calculator Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="theme-dark">
    <div class="calculator-container">
        <!-- Header / Clock -->
        <div class="header">
            <span id="current-date">YYYY-MM-DD</span>
            <span id="current-time">00:00:00 AM</span>
            <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
        </div>

        <!-- Display Area -->
        <div class="display-container">
            <div id="live-preview" class="live-preview"></div>
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <!-- Note Input Area -->
        <div class="input-container">
            <input type="text" id="calc-note" placeholder="විස්තරය (උදා: බඩු ලැයිස්තුව)..." autocomplete="off">
            <div id="custom-suggestions" class="suggestions-box hidden"></div>
        </div>

        <!-- Action Bar: Save Text + Icon-only Buttons -->
        <div class="action-bar-grid">
            <button id="save-btn" class="action-btn save">💾 Save</button>
            <button id="view-btn" class="action-btn view icon-only" title="History බලන්න">📜</button>
            <button id="download-btn" class="action-btn export icon-only" title="Export / Share">📥</button>
        </div>

        <!-- Numpad Buttons -->
        <div class="buttons">
            <button data-action="clear" class="btn btn-cmd">C</button>
            <button data-action="delete" class="btn btn-cmd">⌫</button>
            <button data-val="/" class="btn btn-op">÷</button>
            <button data-val="*" class="btn btn-op">×</button>

            <button data-val="7" class="btn">7</button>
            <button data-val="8" class="btn">8</button>
            <button data-val="9" class="btn">9</button>
            <button data-val="-" class="btn btn-op">-</button>

            <button data-val="4" class="btn">4</button>
            <button data-val="5" class="btn">5</button>
            <button data-val="6" class="btn">6</button>
            <button data-val="+" class="btn btn-op">+</button>

            <button data-val="1" class="btn">1</button>
            <button data-val="2" class="btn">2</button>
            <button data-val="3" class="btn">3</button>
            <button data-action="calculate" class="btn btn-equal font-lg">=</button>

            <button data-val="0" class="btn btn-zero">0</button>
            <button data-val="." class="btn">.</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-message" class="toast hidden"></div>

    <!-- Saved History Modal -->
    <div id="saved-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="txt-saved-title">Saved History</h3>
                <button id="clear-all-btn" class="danger-btn icon-only-sm" title="සියල්ල මකන්න">🗑️</button>
            </div>

            <!-- Search Control -->
            <div class="history-controls">
                <input type="text" id="history-search" placeholder="🔍 සෙවුම...">
            </div>

            <div id="saved-list" class="saved-list"></div>

            <!-- History Total Display -->
            <div class="history-total-box">
                <span>මුළු එකතුව (Total):</span>
                <span id="history-total-val">0.00</span>
            </div>

            <button id="close-modal-btn" class="close-btn margin-top-10" title="Close">✖️</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="txt-edit-title">සංස්කරණය</h3>
                <span id="close-edit-btn" class="close-x">&times;</span>
            </div>
            <div class="edit-form">
                <label>විස්තරය / Note:</label>
                <input type="text" id="edit-note">
                <label>අගය / Value:</label>
                <input type="text" id="edit-expression">
                <div class="modal-actions icon-actions">
                    <button id="save-edit-btn" class="action-btn save icon-only" title="Save Changes">💾</button>
                    <button id="cancel-edit-btn" class="action-btn cancel icon-only" title="Cancel">✖️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="download-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="txt-export-title">Export / Share</h3>
                <span id="close-download-btn" class="close-x">&times;</span>
            </div>
            <div class="export-form">
                <label>File Name:</label>
                <input type="text" id="export-filename" placeholder="Enter file name...">
                <label>Format:</label>
                <select id="export-format">
                    <option value="pdf">PDF Document (.pdf)</option>
                    <option value="word">Word Document (.doc)</option>
                    <option value="xml">XML Data (.xml)</option>
                    <option value="html">HTML Webpage (.html)</option>
                </select>
                <div class="modal-actions icon-actions">
                    <button id="confirm-download-btn" class="action-btn export icon-only" title="Download">
                        <span id="download-btn-text">⬇️</span>
                    </button>
                    <button id="confirm-share-btn" class="action-btn share icon-only" title="Share File">
                        <span id="share-btn-text">🔗</span>
                    </button>
                    <button id="cancel-download-btn" class="action-btn cancel icon-only" title="Cancel">✖️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="txt-settings-title">⚙️ Settings</h3>
                <span id="close-settings-x" class="close-x">&times;</span>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <span>Theme</span>
                    <select id="theme-select">
                        <option value="theme-dark">🌙 Dark Mode</option>
                        <option value="theme-light">☀️ Light Mode</option>
                        <option value="theme-neon">⚡ Neon Cyber</option>
                        <option value="theme-emerald">🌿 Emerald Green</option>
                    </select>
                </div>

                <div class="setting-item">
                    <span>Button Sound / Feedback</span>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="setting-item flex-col align-start">
                    <span>Music Player 🎵</span>
                    <div class="music-player-box">
                        <div id="player-song-title" class="song-title">2026 Sinhala Hit 01</div>
                        <div id="audio-visualizer" class="visualizer-container">
                            <div class="v-bar"></div>
                            <div class="v-bar"></div>
                            <div class="v-bar"></div>
                            <div class="v-bar"></div>
                            <div class="v-bar"></div>
                        </div>

                        <div class="player-controls">
                            <button id="player-prev-btn" class="player-btn">⏮️</button>
                            <button id="player-play-btn" class="player-btn play-btn">▶️</button>
                            <button id="player-next-btn" class="player-btn">⏭️</button>
                        </div>

                        <div class="volume-box">
                            <span>🔊</span>
                            <input type="range" id="player-volume" min="0" max="1" step="0.05" value="0.5">
                        </div>
                    </div>
                </div>

                <div class="setting-item flex-col align-start">
                    <span>Data Backup & Sync</span>
                    <div class="backup-actions">
                        <button id="export-json-btn" class="btn-small">💾 Backup</button>
                        <button id="import-json-btn" class="btn-small">📂 Restore</button>
                        <input type="file" id="import-file-input" accept=".json" class="hidden">
                    </div>
                </div>
            </div>
            <button id="close-settings-btn" class="close-btn margin-top-15" title="Close">✖️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
